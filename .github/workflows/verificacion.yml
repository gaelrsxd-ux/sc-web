# Barreras que no dependen de que nadie se acuerde.
#
# Este archivo sustituye a `verificacion.yml.propuesta`, que llevaba meses sin
# ejecutarse porque GitHub sólo corre `.yml`. Se activa recortado a propósito:
# de las cuatro comprobaciones que proponía aquél, aquí van SÓLO las dos que no
# necesitan red ni levantar `wrangler dev`.
#
# Por qué el recorte y no el archivo entero: la suite del limitador arranca
# varios `wrangler dev`, tarda ~65 s en una máquina local y varias de sus
# pruebas llaman al siteverify REAL de Cloudflare. En un runner compartido eso
# falla por motivos que no son el suyo, y un CI que falla por ruido se ignora a
# la semana. Las dos que quedan corren en segundos, no necesitan ningún secreto
# y son exactamente las que cubren los dos fallos que de verdad tumban esta web:
# un secreto commiteado y una huella de CSP desfasada.
#
# Para añadir la suite del Worker hace falta antes resolver lo que documenta
# `verificacion.yml.propuesta`: puertos libres en el runner y una variante sin
# red de las pruebas de Turnstile.

name: verificación

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Fijadas por SHA y no por etiqueta: una etiqueta móvil se puede
      # reapuntar, y este job corre sobre el contenido del repositorio.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # El escáner con --todo mira los archivos versionados; el historial
          # completo permite ampliarlo a los commits el día que haga falta.
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '24'

      - name: Escáner de secretos
        run: node tools/scan-secretos.mjs --todo

      # Las hojas de estilo se sirven bajo un nombre que no cambia nunca, y
      # Safari en iOS las reutiliza sin volver a preguntar: HTML nuevo con CSS
      # viejo, que no se parece a un fallo de caché sino a un diseño roto. Pasó
      # tres veces en el mismo teléfono. La huella del contenido en la
      # dirección lo cierra: cambia el CSS, cambia la dirección.
      - name: Huella de las hojas de estilo en su enlace
        run: node tools/assets.mjs --check

      - name: Hashes de la CSP sincronizados con el HTML
        run: node tools/csp-hashes.mjs --check

      # Los precios del HTML se generan desde tools/precios.mjs. Sin esta
      # comprobación, editar un precio a mano deja la web enseñando una cifra y
      # el WhatsApp que se abre pidiendo otra, y eso lo descubre el cliente.
      - name: Precios del HTML generados desde la tabla
        run: node tools/precios.mjs --check

      # Las colonias por código postal y la lista de ciudades que rellenan el
      # formulario de envío. No vuelve a descargar el catálogo de SEPOMEX: sólo
      # comprueba que lo publicado se sostiene solo —códigos de cinco dígitos,
      # cada uno en su archivo, y ningún estado fuera de los que ofrece el
      # desplegable de pedido.html, que es el fallo que dejaría el campo
      # «Estado» vacío sin decir por qué.
      - name: Colonias y ciudades bien generadas
        run: node tools/cp.mjs --check

      - name: Rutas permanentes de menús bien generadas
        run: node tools/menus.mjs --check

      - name: Seguridad del catálogo de menús
        run: node --test pruebas/menus.mjs

      # El Worker de cobros. Estas pruebas no necesitan red ni wrangler: el
      # fetch se sustituye por un doble. La que justifica tenerlas en CI es la
      # que exige que el importe salga de la tabla del servidor y no del
      # formulario; sin ella, un descuido cobraría un peso por veinte placas.
      - name: Pruebas del Worker de cobros
        run: node --test test/pagos.test.mjs
        working-directory: Kimi_Agent_Web 3D Optimizada/cloudflare/pagos

      # Falla. Durante un tiempo sólo avisaba, porque los datos que faltaban
      # sólo los tenía el titular; ya están puestos, así que la barrera muerde.
      - name: Documentos legales sin marcadores de relleno
        run: |
          if grep -rn "POR COMPLETAR" "Kimi_Agent_Web 3D Optimizada/app" 2>/dev/null; then
            echo "::error::Hay marcadores «POR COMPLETAR» en documentos legales publicados."
            exit 1
          fi
