# Escenario de fallo: el binding del Durable Object NO existe.
# Sirve para comprobar que el Worker responde 503 y NO ejecuta el análisis.
# Nunca se despliega.

name = "syc-seo-audit-sinbinding"
main = "arnes.js"
compatibility_date = "2026-07-01"

[vars]
ENTORNO = "dev"
LIMITE_ATOMICO = "on"
SAL_LIMITE = "5b8f2c1e9a4d7063fe1528cb3a9d64e07f2b8c5a1d3e6904b7f8c2a5d1e63b90"  # secreto-permitido: valor falso de pruebas
TURNSTILE_SECRET = "1x0000000000000000000000000000000AA"
TURNSTILE_HOSTNAMES = "example.com"

# A propósito: sin [[durable_objects.bindings]] y sin [[migrations]].

[[services]]
binding = "YO"
service = "syc-seo-audit-sinbinding"
