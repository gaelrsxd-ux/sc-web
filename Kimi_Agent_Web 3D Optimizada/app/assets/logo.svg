<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&amp;family=EB+Garamond:wght@500;600&amp;display=swap');
      .brand { font-family: 'Playfair Display', Georgia, serif; }
      .sub { font-family: 'EB Garamond', Georgia, serif; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181F"/>
      <stop offset="60%" stop-color="#0B0E13"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D27A"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9C7A1F"/>
    </linearGradient>
    <!-- plata pulida, para que S&C resalte sobre el dorado -->
    <linearGradient id="silverShine" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%"  stop-color="#AEB0B3"/>
      <stop offset="30%" stop-color="#D3D5D7"/>
      <stop offset="47%" stop-color="#F7F8F9"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="64%" stop-color="#DCDEE0"/>
      <stop offset="100%" stop-color="#9FA1A4"/>
    </linearGradient>
    <linearGradient id="goldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9C868"/>
      <stop offset="100%" stop-color="#B8892E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <circle cx="800" cy="430" r="420" fill="url(#glow)"/>

  <!-- marco art deco -->
  <rect x="60" y="60" width="1480" height="780" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
  <rect x="76" y="76" width="1448" height="748" fill="none" stroke="#8A6A22" stroke-width="1"/>

  <!-- ornamentos de esquina -->
  <g transform="translate(100,100) rotate(0)"><line x1="0" y1="0" x2="46" y2="0" stroke="#D4AF37" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="46" stroke="#D4AF37" stroke-width="2"/><rect x="-6" y="-6" width="12" height="12" fill="#D4AF37" transform="rotate(45 0 0)"/></g><g transform="translate(1500,100) rotate(90)"><line x1="0" y1="0" x2="46" y2="0" stroke="#D4AF37" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="46" stroke="#D4AF37" stroke-width="2"/><rect x="-6" y="-6" width="12" height="12" fill="#D4AF37" transform="rotate(45 0 0)"/></g><g transform="translate(1500,800) rotate(180)"><line x1="0" y1="0" x2="46" y2="0" stroke="#D4AF37" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="46" stroke="#D4AF37" stroke-width="2"/><rect x="-6" y="-6" width="12" height="12" fill="#D4AF37" transform="rotate(45 0 0)"/></g><g transform="translate(100,800) rotate(270)"><line x1="0" y1="0" x2="46" y2="0" stroke="#D4AF37" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="46" stroke="#D4AF37" stroke-width="2"/><rect x="-6" y="-6" width="12" height="12" fill="#D4AF37" transform="rotate(45 0 0)"/></g>

  <!-- kicker superior -->
  <text x="800" y="180" class="sub" font-size="24" fill="#D4AF37" letter-spacing="10" text-anchor="middle" font-weight="600">SOLUTIONS COMPANY</text>
  <line x1="700" y1="200" x2="900" y2="200" stroke="#8A6A22" stroke-width="1"/>

  <!-- globo terraqueo -->
  <clipPath id="globeClip"><circle cx="800" cy="430" r="98"/></clipPath>
  <g clip-path="url(#globeClip)">
    <ellipse cx="800" cy="430" rx="37.2" ry="98" fill="none" stroke="#C9A227" stroke-width="2"/>
    <ellipse cx="800" cy="430" rx="72.5" ry="98" fill="none" stroke="#C9A227" stroke-width="1.5"/>
    <line x1="702" y1="430" x2="898" y2="430" stroke="#C9A227" stroke-width="1.75"/>
    <line x1="711.1" y1="388.8" x2="888.9" y2="388.8" stroke="#8A6A22" stroke-width="1.25"/>
    <line x1="711.1" y1="471.2" x2="888.9" y2="471.2" stroke="#8A6A22" stroke-width="1.25"/>
    <line x1="741.2" y1="351.6" x2="858.8" y2="351.6" stroke="#8A6A22" stroke-width="1"/>
    <line x1="741.2" y1="508.4" x2="858.8" y2="508.4" stroke="#8A6A22" stroke-width="1"/>
  </g>
  <!-- emblema circular -->
  <circle cx="800" cy="430" r="98" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
  <circle cx="800" cy="430" r="86" fill="none" stroke="#8A6A22" stroke-width="1"/>
  <text x="800" y="460" class="brand" font-size="92" font-weight="900" fill="url(#silverShine)" text-anchor="middle">S&amp;C</text>

  <!-- nombre principal -->
  <text x="800" y="660" class="brand" font-size="46" font-weight="700" fill="#F3D27A" text-anchor="middle" letter-spacing="3">SOLUTIONS COMPANY</text>

  <line x1="620" y1="690" x2="980" y2="690" stroke="#D4AF37" stroke-width="1.5"/>

  <text x="800" y="730" class="sub" font-size="20" fill="#B8A874" letter-spacing="6" text-anchor="middle">AMBICIÓN &#183; ESTRATEGIA &#183; RESULTADOS</text>
</svg>
